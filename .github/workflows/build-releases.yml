name: AI Rescue Factory V1-V7 and Anime V19-V22 Acting Combat
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rescue-engine/**"
      - "anime-factory/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/build-releases.yml"
permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check syntax
        run: python -m py_compile rescue-engine/engine.py rescue-engine/launch.py rescue-engine/ai_pipeline.py scripts/build_releases.py scripts/build_v7.py scripts/build_anime_v20.py scripts/build_anime_v21.py scripts/build_anime_v22.py anime-factory/v20/build_story_v20.py anime-factory/v21/build_visual_v21.py anime-factory/v22/build_acting_v22.py anime-factory/v20/patch_preserve.py rescue-engine/unified_v7.py gui_v7.py tests/test_engine.py tests/test_unified_v7.py tests/test_anime_v20.py tests/test_anime_v21.py tests/test_anime_v22.py
      - name: Engine selftest
        run: python rescue-engine/engine.py selftest
      - name: Integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: V20.3 source preservation test
        run: python anime-factory/v20/patch_preserve.py --selftest
      - name: V7 unified selftest
        run: python rescue-engine/unified_v7.py selftest

  visual-smoke:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright only for CI smoke tests
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Generate original V19 + V20 + V21 studio
        run: python anime-factory/v21/build_visual_v21.py --output dist/AI_Anime_Factory_V21_VISUAL_QUALITY.html
      - name: Render and verify actual V21 Canvas in Chromium
        run: python tests/smoke_browser_v21.py --html dist/AI_Anime_Factory_V21_VISUAL_QUALITY.html --out dist/V21_VISUAL_SAMPLES
      - name: Generate original V19 through V22 acting studio
        run: python anime-factory/v22/build_acting_v22.py --output dist/AI_Anime_Factory_V22_ACTING_COMBAT.html
      - name: Render V22 actor expressions and verify JSON / PNG in Chromium
        run: python tests/smoke_browser_v22.py --html dist/AI_Anime_Factory_V22_ACTING_COMBAT.html --out dist/V22_ACTING_SAMPLES
      - name: Upload real V22 actor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V22_ACTING_BROWSER_SAMPLES
          path: dist/V22_ACTING_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload real screenshot QA samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V21_VISUAL_BROWSER_SAMPLES
          path: dist/V21_VISUAL_SAMPLES/
          if-no-files-found: warn
          retention-days: 30

  zip-releases:
    needs: [tests, visual-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and verify all release ZIPs
        run: python scripts/build_releases.py --out dist
      - name: Build standalone V20 Story and Combat ZIP
        run: python scripts/build_anime_v20.py --out dist/AI_ANIME_FACTORY_V20_STORY_COMBAT_WINDOWS.zip
      - name: Build standalone V21 Visual Quality ZIP
        run: python scripts/build_anime_v21.py --out dist/AI_ANIME_FACTORY_V21_VISUAL_QUALITY_WINDOWS.zip
      - name: Build standalone V22 Acting Combat ZIP
        run: python scripts/build_anime_v22.py --out dist/AI_ANIME_FACTORY_V22_ACTING_COMBAT_WINDOWS.zip
      - name: Assemble unified V7 release ZIP
        run: python scripts/build_v7.py --legacy dist --out dist
      - name: Independently verify V7 release ZIP
        run: python scripts/build_v7.py --verify dist/AI_RESCUE_FACTORY_V7_UNIFIED_CANDIDATE_WINDOWS.zip
      - name: Upload downloadable release ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: AI_RESCUE_FACTORY_V1_V7_AND_ANIME_V19_V22_WINDOWS
          path: |
            dist/*.zip
            dist/RELEASE_INDEX.json
          if-no-files-found: error
          retention-days: 30

  publish-v21-download:
    needs: [tests, visual-smoke, zip-releases]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout latest repository branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build final V21 ZIP with SHA256 manifest
        run: python scripts/build_anime_v21.py --out downloads/AI_ANIME_FACTORY_V21_VISUAL_QUALITY_WINDOWS.zip
      - name: Commit verified ZIP to stable direct downloads folder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V21_VISUAL_QUALITY_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V21 ZIP already current"
          else
            git commit -m "Release verified V21 Visual Quality Windows ZIP"
            git push origin HEAD:main
          fi

  publish-v22-download:
    # Publish V21 first, then V22: binary updates must not race on main.
    needs: [tests, visual-smoke, zip-releases, publish-v21-download]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build fully verified V22 ZIP
        run: python scripts/build_anime_v22.py --out downloads/AI_ANIME_FACTORY_V22_ACTING_COMBAT_WINDOWS.zip
      - name: Publish V22 ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V22_ACTING_COMBAT_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V22 ZIP up to date"
          else
            git commit -m "Release verified V22 Acting Combat Windows ZIP"
            git push origin HEAD:main
          fi
