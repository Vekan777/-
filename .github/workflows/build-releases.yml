        with:
          name: AI_ANIME_FACTORY_V34_STORYBOARD_BROWSER_SAMPLES
          path: dist/V34_STORYBOARD_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload V33 real acting expression A/B PNG and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V33_ACTING_BROWSER_SAMPLES
          path: dist/V33_ACTING_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload V32 actual articulated pose comparisons and project report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V32_KEYFRAME_BROWSER_SAMPLES
          path: dist/V32_KEYFRAME_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload V31 real-frame color grade PNG and JSON measurement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V31_VISUAL_BROWSER_SAMPLES
          path: dist/V31_VISUAL_PRODUCTION_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload real V30 canon integrity and visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V30_UNIFIED_BROWSER_SAMPLES
          path: dist/V30_UNIFIED_QA_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload real V29 animation beat PNG comparisons and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V29_POLISH_BROWSER_SAMPLES
          path: dist/V29_POLISH_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload actual V28 environment interaction PNG comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V28_INTERACTION_BROWSER_SAMPLES
          path: dist/V28_INTERACTION_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload real V27 environment before and after browser frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V27_WORLD_BROWSER_SAMPLES
          path: dist/V27_WORLD_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload real V26 cinematography frames and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V26_CINEMATIC_BROWSER_SAMPLES
          path: dist/V26_CINEMATIC_SAMPLES/
