name: AI Rescue Factory V1-V7 and Anime V19-V48 Episode Production
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "rescue-engine/**"
      - "anime-factory/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/build-releases.yml"
permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check syntax
        run: python -m py_compile rescue-engine/engine.py rescue-engine/launch.py rescue-engine/ai_pipeline.py scripts/build_releases.py scripts/build_v7.py scripts/build_anime_v20.py scripts/build_anime_v21.py scripts/build_anime_v22.py scripts/build_anime_v23.py scripts/build_anime_v24.py scripts/build_anime_v25.py scripts/build_anime_v26.py scripts/build_anime_v27.py scripts/build_anime_v28.py scripts/build_anime_v29.py scripts/build_anime_v30.py scripts/build_anime_v31.py scripts/build_anime_v32.py scripts/build_anime_v33.py scripts/build_anime_v34.py scripts/build_anime_v35.py scripts/build_anime_v36.py scripts/build_anime_v37.py scripts/build_anime_v38.py scripts/build_anime_v39.py scripts/build_anime_v40.py scripts/build_anime_v41.py scripts/build_anime_v42.py scripts/build_anime_v43.py scripts/build_anime_v44.py scripts/build_anime_v45.py scripts/build_anime_v46.py scripts/build_anime_v47.py scripts/build_anime_v48.py scripts/render_anime_v48.py anime-factory/v20/build_story_v20.py anime-factory/v21/build_visual_v21.py anime-factory/v22/build_acting_v22.py anime-factory/v23/build_character_v23.py anime-factory/v24/build_animation_v24.py anime-factory/v25/build_combat_v25.py anime-factory/v26/build_cinematic_v26.py anime-factory/v27/build_world_v27.py anime-factory/v28/build_interaction_v28.py anime-factory/v29/build_polish_v29.py anime-factory/v30/build_unified_v30.py anime-factory/v31/build_visual_v31.py anime-factory/v32/build_keyframes_v32.py anime-factory/v33/build_acting_v33.py anime-factory/v34/build_storyboard_v34.py anime-factory/v35/build_assembly_v35.py anime-factory/v36/build_audio_v36.py anime-factory/v37/build_subtitles_v37.py anime-factory/v38/build_cinematic_v38.py anime-factory/v39/build_performance_v39.py anime-factory/v40/build_art_v40.py anime-factory/v41/build_silhouette_v41.py anime-factory/v42/build_stage_v42.py anime-factory/v43/build_director_v43.py anime-factory/v44/build_keyposes_v44.py anime-factory/v45/build_art_engine_v45.py anime-factory/v46/build_animation_v46.py anime-factory/v47/build_voice_v47.py anime-factory/v48/build_episode_v48.py anime-factory/v20/patch_preserve.py rescue-engine/unified_v7.py gui_v7.py tests/test_engine.py tests/test_unified_v7.py tests/test_anime_v20.py tests/test_anime_v21.py tests/test_anime_v22.py tests/test_anime_v23.py tests/test_anime_v24.py tests/test_anime_v25.py tests/test_anime_v26.py tests/test_anime_v27.py tests/test_anime_v28.py tests/test_anime_v29.py tests/test_anime_v30.py tests/test_anime_v31.py tests/test_anime_v32.py tests/test_anime_v33.py tests/test_anime_v34.py tests/test_anime_v35.py tests/test_anime_v36.py tests/test_anime_v37.py tests/test_anime_v38.py tests/test_anime_v39.py tests/test_anime_v40.py tests/test_anime_v41.py tests/test_anime_v42.py tests/test_anime_v43.py tests/test_anime_v44.py tests/test_anime_v45.py tests/test_anime_v46.py tests/test_anime_v47.py tests/test_anime_v48.py tests/smoke_browser_v23.py tests/smoke_browser_v24.py tests/smoke_browser_v25.py tests/smoke_browser_v26.py tests/smoke_browser_v27.py tests/smoke_browser_v28.py tests/smoke_browser_v29.py tests/smoke_browser_v30.py tests/smoke_browser_v31.py tests/smoke_browser_v32.py tests/smoke_browser_v33.py tests/smoke_browser_v34.py tests/smoke_browser_v35.py tests/smoke_browser_v36.py tests/smoke_browser_v37.py tests/smoke_browser_v38.py tests/smoke_browser_v39.py tests/smoke_browser_v40.py tests/smoke_browser_v41.py tests/smoke_browser_v42.py tests/smoke_browser_v43.py tests/smoke_browser_v44.py tests/smoke_browser_v45.py tests/smoke_browser_v46.py tests/smoke_browser_v47.py tests/smoke_browser_v48.py
      - name: Engine selftest
        run: python rescue-engine/engine.py selftest
      - name: Integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: V20.3 source preservation test
        run: python anime-factory/v20/patch_preserve.py --selftest
      - name: V7 unified selftest
        run: python rescue-engine/unified_v7.py selftest

  visual-smoke:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright only for CI smoke tests
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Generate original V19 + V20 + V21 studio
        run: python anime-factory/v21/build_visual_v21.py --output dist/AI_Anime_Factory_V21_VISUAL_QUALITY.html
      - name: Render and verify actual V21 Canvas in Chromium
        run: python tests/smoke_browser_v21.py --html dist/AI_Anime_Factory_V21_VISUAL_QUALITY.html --out dist/V21_VISUAL_SAMPLES
      - name: Generate original V19 through V22 acting studio
        run: python anime-factory/v22/build_acting_v22.py --output dist/AI_Anime_Factory_V22_ACTING_COMBAT.html
      - name: Render V22 actor expressions and verify JSON / PNG in Chromium
        run: python tests/smoke_browser_v22.py --html dist/AI_Anime_Factory_V22_ACTING_COMBAT.html --out dist/V22_ACTING_SAMPLES
      - name: Generate preserved V19 through V23 character studio
        run: python anime-factory/v23/build_character_v23.py --output dist/AI_Anime_Factory_V23_CHARACTER_QUALITY.html
      - name: Render V23 character anatomy and verify V20–V23 reload in Chromium
        run: python tests/smoke_browser_v23.py --html dist/AI_Anime_Factory_V23_CHARACTER_QUALITY.html --out dist/V23_CHARACTER_SAMPLES
      - name: Generate genuine V19–V24 animation studio
        run: python anime-factory/v24/build_animation_v24.py --output dist/AI_Anime_Factory_V24_CHARACTER_ANIMATION.html
      - name: Chromium A/B gait + pose preservation and export QA for V24
        run: python tests/smoke_browser_v24.py --html dist/AI_Anime_Factory_V24_CHARACTER_ANIMATION.html --out dist/V24_CHARACTER_ANIMATION_SAMPLES
      - name: Generate original V19 through V25 combat choreography
        run: python anime-factory/v25/build_combat_v25.py --output dist/AI_Anime_Factory_V25_COMBAT_CHOREOGRAPHY.html
      - name: Chromium V25 A/B fighter coordination and JSON persistence
        run: python tests/smoke_browser_v25.py --html dist/AI_Anime_Factory_V25_COMBAT_CHOREOGRAPHY.html --out dist/V25_COMBAT_SAMPLES
      - name: Build original V19 through V26 cinematic combat
        run: python anime-factory/v26/build_cinematic_v26.py --output dist/AI_Anime_Factory_V26_CINEMATIC_COMBAT.html
      - name: Chromium V26 camera A/B, settings and story integrity smoke
        run: python tests/smoke_browser_v26.py --html dist/AI_Anime_Factory_V26_CINEMATIC_COMBAT.html --out dist/V26_CINEMATIC_SAMPLES
      - name: Build original V19 through V27 world quality
        run: python anime-factory/v27/build_world_v27.py --output dist/AI_Anime_Factory_V27_WORLD_QUALITY.html
      - name: Render and verify real V27 world layers, settings and JSON in Chromium
        run: python tests/smoke_browser_v27.py --html dist/AI_Anime_Factory_V27_WORLD_QUALITY.html --out dist/V27_WORLD_SAMPLES
      - name: Build V28 from original V19 through V27
        run: python anime-factory/v28/build_interaction_v28.py --output dist/AI_Anime_Factory_V28_CHARACTER_WORLD_INTERACTION.html
      - name: Chromium V28 actor/environment A-B, event gates, JSON reload and PNG
        run: python tests/smoke_browser_v28.py --html dist/AI_Anime_Factory_V28_CHARACTER_WORLD_INTERACTION.html --out dist/V28_INTERACTION_SAMPLES
      - name: Build genuine V19 through V29 synchronized combat animation
        run: python anime-factory/v29/build_polish_v29.py --output dist/AI_Anime_Factory_V29_ANIMATION_COMBAT_POLISH.html
      - name: Chromium V29 procedural rig timing and preserved story QA
        run: python tests/smoke_browser_v29.py --html dist/AI_Anime_Factory_V29_ANIMATION_COMBAT_POLISH.html --out dist/V29_POLISH_SAMPLES
      - name: Build original V19 through V30 unified quality studio
        run: python anime-factory/v30/build_unified_v30.py --output dist/AI_Anime_Factory_V30_UNIFIED_QUALITY_REVIEW.html
      - name: Chromium V30 protected canon checkpoint, backup, scene change and PNG
        run: python tests/smoke_browser_v30.py --html dist/AI_Anime_Factory_V30_UNIFIED_QUALITY_REVIEW.html --out dist/V30_UNIFIED_QA_SAMPLES
      - name: Generate V31 real pixel QC from original V19 and additive versions
        run: python anime-factory/v31/build_visual_v31.py --output dist/AI_Anime_Factory_V31_VISUAL_PRODUCTION_REVIEW.html
      - name: Chromium V31 actual frame grading, dark-bright detector and history preservation
        run: python tests/smoke_browser_v31.py --html dist/AI_Anime_Factory_V31_VISUAL_PRODUCTION_REVIEW.html --out dist/V31_VISUAL_PRODUCTION_SAMPLES
      - name: Build V32 from preserved original V19 through V31
        run: python anime-factory/v32/build_keyframes_v32.py --output dist/AI_Anime_Factory_V32_KEYFRAME_READABILITY.html
      - name: Chromium V32 actual rig joints, keyframe controls and historic project data
        run: python tests/smoke_browser_v32.py --html dist/AI_Anime_Factory_V32_KEYFRAME_READABILITY.html --out dist/V32_KEYFRAME_SAMPLES
      - name: Generate V33 real procedural acting from original V19 through V32
        run: python anime-factory/v33/build_acting_v33.py --output dist/AI_Anime_Factory_V33_ACTING_EXPRESSION.html
      - name: Chromium V33 compare acting facial poses, preserve canon and export PNGs
        run: python tests/smoke_browser_v33.py --html dist/AI_Anime_Factory_V33_ACTING_EXPRESSION.html --out dist/V33_ACTING_SAMPLES
      - name: Build V34 storyboard camera from original V19 through V33
        run: python anime-factory/v34/build_storyboard_v34.py --output dist/AI_Anime_Factory_V34_STORYBOARD_CONTINUITY.html
      - name: Chromium V34 real shot framing, adjacent scene axis audit and PNG
        run: python tests/smoke_browser_v34.py --html dist/AI_Anime_Factory_V34_STORYBOARD_CONTINUITY.html --out dist/V34_STORYBOARD_SAMPLES
      - name: Build V35 continuous episode editor from genuine V19 through V34
        run: python anime-factory/v35/build_assembly_v35.py --output dist/AI_Anime_Factory_V35_SCENE_ASSEMBLY.html
      - name: Chromium V35 true episode timeline, crossfade, playback and source integrity
        run: python tests/smoke_browser_v35.py --html dist/AI_Anime_Factory_V35_SCENE_ASSEMBLY.html --out dist/V35_EPISODE_SAMPLES
