name: AI Rescue Factory V1-V7 and Anime V19-V26 Cinematic Combat
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "rescue-engine/**"
      - "anime-factory/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/build-releases.yml"
permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check syntax
        run: python -m py_compile rescue-engine/engine.py rescue-engine/launch.py rescue-engine/ai_pipeline.py scripts/build_releases.py scripts/build_v7.py scripts/build_anime_v20.py scripts/build_anime_v21.py scripts/build_anime_v22.py scripts/build_anime_v23.py scripts/build_anime_v24.py scripts/build_anime_v25.py scripts/build_anime_v26.py anime-factory/v20/build_story_v20.py anime-factory/v21/build_visual_v21.py anime-factory/v22/build_acting_v22.py anime-factory/v23/build_character_v23.py anime-factory/v24/build_animation_v24.py anime-factory/v25/build_combat_v25.py anime-factory/v26/build_cinematic_v26.py anime-factory/v20/patch_preserve.py rescue-engine/unified_v7.py gui_v7.py tests/test_engine.py tests/test_unified_v7.py tests/test_anime_v20.py tests/test_anime_v21.py tests/test_anime_v22.py tests/test_anime_v23.py tests/test_anime_v24.py tests/test_anime_v25.py tests/test_anime_v26.py tests/smoke_browser_v23.py tests/smoke_browser_v24.py tests/smoke_browser_v25.py tests/smoke_browser_v26.py
      - name: Engine selftest
        run: python rescue-engine/engine.py selftest
      - name: Integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: V20.3 source preservation test
        run: python anime-factory/v20/patch_preserve.py --selftest
      - name: V7 unified selftest
        run: python rescue-engine/unified_v7.py selftest

  visual-smoke:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright only for CI smoke tests
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Generate original V19 + V20 + V21 studio
        run: python anime-factory/v21/build_visual_v21.py --output dist/AI_Anime_Factory_V21_VISUAL_QUALITY.html
      - name: Render and verify actual V21 Canvas in Chromium
        run: python tests/smoke_browser_v21.py --html dist/AI_Anime_Factory_V21_VISUAL_QUALITY.html --out dist/V21_VISUAL_SAMPLES
      - name: Generate original V19 through V22 acting studio
        run: python anime-factory/v22/build_acting_v22.py --output dist/AI_Anime_Factory_V22_ACTING_COMBAT.html
      - name: Render V22 actor expressions and verify JSON / PNG in Chromium
        run: python tests/smoke_browser_v22.py --html dist/AI_Anime_Factory_V22_ACTING_COMBAT.html --out dist/V22_ACTING_SAMPLES
      - name: Generate preserved V19 through V23 character studio
        run: python anime-factory/v23/build_character_v23.py --output dist/AI_Anime_Factory_V23_CHARACTER_QUALITY.html
      - name: Render V23 character anatomy and verify V20–V23 reload in Chromium
        run: python tests/smoke_browser_v23.py --html dist/AI_Anime_Factory_V23_CHARACTER_QUALITY.html --out dist/V23_CHARACTER_SAMPLES
      - name: Generate genuine V19–V24 animation studio
        run: python anime-factory/v24/build_animation_v24.py --output dist/AI_Anime_Factory_V24_CHARACTER_ANIMATION.html
      - name: Chromium A/B gait + pose preservation and export QA for V24
        run: python tests/smoke_browser_v24.py --html dist/AI_Anime_Factory_V24_CHARACTER_ANIMATION.html --out dist/V24_CHARACTER_ANIMATION_SAMPLES
      - name: Generate original V19 through V25 combat choreography
        run: python anime-factory/v25/build_combat_v25.py --output dist/AI_Anime_Factory_V25_COMBAT_CHOREOGRAPHY.html
      - name: Chromium V25 A/B fighter coordination and JSON persistence
        run: python tests/smoke_browser_v25.py --html dist/AI_Anime_Factory_V25_COMBAT_CHOREOGRAPHY.html --out dist/V25_COMBAT_SAMPLES
      - name: Build original V19 through V26 cinematic combat
        run: python anime-factory/v26/build_cinematic_v26.py --output dist/AI_Anime_Factory_V26_CINEMATIC_COMBAT.html
      - name: Chromium V26 camera A/B, settings and story integrity smoke
        run: python tests/smoke_browser_v26.py --html dist/AI_Anime_Factory_V26_CINEMATIC_COMBAT.html --out dist/V26_CINEMATIC_SAMPLES
      - name: Upload real V26 cinematography frames and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V26_CINEMATIC_BROWSER_SAMPLES
          path: dist/V26_CINEMATIC_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload verified V25 real combat PNG samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V25_COMBAT_BROWSER_SAMPLES
          path: dist/V25_COMBAT_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload real V24 animation frames and A/B comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V24_ANIMATION_BROWSER_SAMPLES
          path: dist/V24_CHARACTER_ANIMATION_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload real V23 character QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V23_CHARACTER_BROWSER_SAMPLES
          path: dist/V23_CHARACTER_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload real V22 actor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V22_ACTING_BROWSER_SAMPLES
          path: dist/V22_ACTING_SAMPLES/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload real screenshot QA samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V21_VISUAL_BROWSER_SAMPLES
          path: dist/V21_VISUAL_SAMPLES/
          if-no-files-found: warn
          retention-days: 30

  zip-releases:
    needs: [tests, visual-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and verify all release ZIPs
        run: python scripts/build_releases.py --out dist
      - name: Build standalone V20 Story and Combat ZIP
        run: python scripts/build_anime_v20.py --out dist/AI_ANIME_FACTORY_V20_STORY_COMBAT_WINDOWS.zip
      - name: Build standalone V21 Visual Quality ZIP
        run: python scripts/build_anime_v21.py --out dist/AI_ANIME_FACTORY_V21_VISUAL_QUALITY_WINDOWS.zip
      - name: Build standalone V22 Acting Combat ZIP
        run: python scripts/build_anime_v22.py --out dist/AI_ANIME_FACTORY_V22_ACTING_COMBAT_WINDOWS.zip
      - name: Build standalone V23 Character Quality ZIP
        run: python scripts/build_anime_v23.py --out dist/AI_ANIME_FACTORY_V23_CHARACTER_QUALITY_WINDOWS.zip
      - name: Build standalone V24 Character Animation ZIP
        run: python scripts/build_anime_v24.py --out dist/AI_ANIME_FACTORY_V24_CHARACTER_ANIMATION_WINDOWS.zip
      - name: Build standalone V25 Combat Choreography Windows ZIP
        run: python scripts/build_anime_v25.py --out dist/AI_ANIME_FACTORY_V25_COMBAT_CHOREOGRAPHY_WINDOWS.zip
      - name: Build V26 cinematic combat ZIP with integrity manifest
        run: python scripts/build_anime_v26.py --out dist/AI_ANIME_FACTORY_V26_CINEMATIC_COMBAT_WINDOWS.zip
      - name: Assemble unified V7 release ZIP
        run: python scripts/build_v7.py --legacy dist --out dist
      - name: Independently verify V7 release ZIP
        run: python scripts/build_v7.py --verify dist/AI_RESCUE_FACTORY_V7_UNIFIED_CANDIDATE_WINDOWS.zip
      - name: Upload downloadable release ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: AI_RESCUE_FACTORY_V1_V7_AND_ANIME_V19_V26_WINDOWS
          path: |
            dist/*.zip
            dist/RELEASE_INDEX.json
          if-no-files-found: error
          retention-days: 30

  publish-v21-download:
    needs: [tests, visual-smoke, zip-releases]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout latest repository branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build final V21 ZIP with SHA256 manifest
        run: python scripts/build_anime_v21.py --out downloads/AI_ANIME_FACTORY_V21_VISUAL_QUALITY_WINDOWS.zip
      - name: Commit verified ZIP to stable direct downloads folder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V21_VISUAL_QUALITY_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V21 ZIP already current"
          else
            git commit -m "Release verified V21 Visual Quality Windows ZIP"
            git push origin HEAD:main
          fi

  publish-v22-download:
    # Publish V21 first, then V22: binary updates must not race on main.
    needs: [tests, visual-smoke, zip-releases, publish-v21-download]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build fully verified V22 ZIP
        run: python scripts/build_anime_v22.py --out downloads/AI_ANIME_FACTORY_V22_ACTING_COMBAT_WINDOWS.zip
      - name: Publish V22 ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V22_ACTING_COMBAT_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V22 ZIP up to date"
          else
            git commit -m "Release verified V22 Acting Combat Windows ZIP"
            git push origin HEAD:main
          fi

  publish-v23-download:
    # Wait for V21 and V22; all binary ZIP commits must be serialized.
    needs: [tests, visual-smoke, zip-releases, publish-v22-download]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build verified V23 ZIP
        run: python scripts/build_anime_v23.py --out downloads/AI_ANIME_FACTORY_V23_CHARACTER_QUALITY_WINDOWS.zip
      - name: Publish V23 ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V23_CHARACTER_QUALITY_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V23 ZIP up to date"
          else
            git commit -m "Release verified V23 Character Quality Windows ZIP"
            git push origin HEAD:main
          fi

  publish-v24-download:
    # V21, V22 and V23 binary uploads complete before V24 to avoid Git ref races.
    needs: [tests, visual-smoke, zip-releases, publish-v23-download]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and verify V24 ZIP with SHA256 manifest
        run: python scripts/build_anime_v24.py --out downloads/AI_ANIME_FACTORY_V24_CHARACTER_ANIMATION_WINDOWS.zip
      - name: Publish verified V24 ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V24_CHARACTER_ANIMATION_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V24 ZIP already published"
          else
            git commit -m "Release verified V24 Character Animation Windows ZIP"
            git push origin HEAD:main
          fi

  publish-v25-download:
    # Serialize binary release publishes through V21–V24 to avoid branch races.
    needs: [tests, visual-smoke, zip-releases, publish-v24-download]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and verify V25 Windows archive
        run: python scripts/build_anime_v25.py --out downloads/AI_ANIME_FACTORY_V25_COMBAT_CHOREOGRAPHY_WINDOWS.zip
      - name: Publish verified V25 ZIP without replacing previous versions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V25_COMBAT_CHOREOGRAPHY_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V25 already published"
          else
            git commit -m "Release verified V25 Combat Choreography Windows ZIP"
            git push origin HEAD:main
          fi

  publish-v26-download:
    # Serial publication prevents competing git updates to main.
    needs: [tests, visual-smoke, zip-releases, publish-v25-download]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build verified V26 cinematic Windows package
        run: python scripts/build_anime_v26.py --out downloads/AI_ANIME_FACTORY_V26_CINEMATIC_COMBAT_WINDOWS.zip
      - name: Commit V26 without replacing V25 or older releases
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V26_CINEMATIC_COMBAT_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V26 is already published"
          else
            git commit -m "Release verified V26 Cinematic Combat Windows ZIP"
            git push origin HEAD:main
          fi
