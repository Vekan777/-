          python-version: "3.13"
      - name: Build and verify all release ZIPs
        run: python scripts/build_releases.py --out dist
      - name: Build standalone V20 Story and Combat ZIP
        run: python scripts/build_anime_v20.py --out dist/AI_ANIME_FACTORY_V20_STORY_COMBAT_WINDOWS.zip
      - name: Build standalone V21 Visual Quality ZIP
        run: python scripts/build_anime_v21.py --out dist/AI_ANIME_FACTORY_V21_VISUAL_QUALITY_WINDOWS.zip
      - name: Build standalone V22 Acting Combat ZIP
        run: python scripts/build_anime_v22.py --out dist/AI_ANIME_FACTORY_V22_ACTING_COMBAT_WINDOWS.zip
      - name: Build standalone V23 Character Quality ZIP
        run: python scripts/build_anime_v23.py --out dist/AI_ANIME_FACTORY_V23_CHARACTER_QUALITY_WINDOWS.zip
      - name: Build standalone V24 Character Animation ZIP
        run: python scripts/build_anime_v24.py --out dist/AI_ANIME_FACTORY_V24_CHARACTER_ANIMATION_WINDOWS.zip
      - name: Build standalone V25 Combat Choreography Windows ZIP
        run: python scripts/build_anime_v25.py --out dist/AI_ANIME_FACTORY_V25_COMBAT_CHOREOGRAPHY_WINDOWS.zip
      - name: Build V26 cinematic combat ZIP with integrity manifest
