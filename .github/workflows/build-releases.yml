name: AI Rescue Factory V1-V7 Unified and Anime V19/V20 - Build ZIPs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rescue-engine/**"
      - "anime-factory/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/build-releases.yml"
permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check syntax
        run: python -m py_compile rescue-engine/engine.py rescue-engine/launch.py rescue-engine/ai_pipeline.py scripts/build_releases.py scripts/build_v7.py scripts/build_anime_v20.py anime-factory/v20/build_story_v20.py anime-factory/v20/patch_preserve.py rescue-engine/unified_v7.py gui_v7.py tests/test_engine.py tests/test_unified_v7.py tests/test_anime_v20.py
      - name: Engine selftest
        run: python rescue-engine/engine.py selftest
      - name: Integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: V20.3 source preservation test
        run: python anime-factory/v20/patch_preserve.py --selftest
      - name: V7 unified selftest
        run: python rescue-engine/unified_v7.py selftest

  zip-releases:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and verify all release ZIPs
        run: python scripts/build_releases.py --out dist
      - name: Build standalone V20 Story and Combat ZIP
        run: python scripts/build_anime_v20.py --out dist/AI_ANIME_FACTORY_V20_STORY_COMBAT_WINDOWS.zip
      - name: Assemble unified V7 release ZIP
        run: python scripts/build_v7.py --legacy dist --out dist
      - name: Independently verify V7 release ZIP
        run: python scripts/build_v7.py --verify dist/AI_RESCUE_FACTORY_V7_UNIFIED_CANDIDATE_WINDOWS.zip
      - name: Upload downloadable release ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: AI_RESCUE_FACTORY_V1_V7_UNIFIED_AND_ANIME_V19_V20_WINDOWS
          path: |
            dist/*.zip
            dist/RELEASE_INDEX.json
          if-no-files-found: error
          retention-days: 30
