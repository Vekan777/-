      - name: Build standalone V41 Silhouette Windows ZIP
        run: python scripts/build_anime_v41.py --out dist/AI_ANIME_FACTORY_V41_SILHOUETTE_STUDIO_WINDOWS.zip
      - name: Build standalone V42 Stage Depth Windows ZIP
        run: python scripts/build_anime_v42.py --out dist/AI_ANIME_FACTORY_V42_STAGE_DEPTH_WINDOWS.zip
      - name: Build V43 Action Camera Windows ZIP
        run: python scripts/build_anime_v43.py --out dist/AI_ANIME_FACTORY_V43_ACTION_DIRECTOR_WINDOWS.zip
      - name: Build standalone V44 True Actor Keyposes Windows ZIP
        run: python scripts/build_anime_v44.py --out dist/AI_ANIME_FACTORY_V44_TRUE_KEYPOSES_WINDOWS.zip
      - name: Build standalone V45 Art/Engine Windows ZIP
        run: python scripts/build_anime_v45.py --out dist/AI_ANIME_FACTORY_V45_ART_ENGINE_WINDOWS.zip
      - name: Build standalone V46 animation Windows ZIP
        run: python scripts/build_anime_v46.py --out dist/AI_ANIME_FACTORY_V46_ANIMATION_ENGINE_WINDOWS.zip
      - name: Build V47 Portable Voice Windows ZIP
        run: python scripts/build_anime_v47.py --out dist/AI_ANIME_FACTORY_V47_PORTABLE_VOICE_WINDOWS.zip
      - name: Build V48 Episode Production Windows ZIP
        run: python scripts/build_anime_v48.py --out dist/AI_ANIME_FACTORY_V48_EPISODE_ENGINE_WINDOWS.zip
      - name: Assemble unified V7 release ZIP
        run: python scripts/build_v7.py --legacy dist --out dist
      - name: Independently verify V7 release ZIP
        run: python scripts/build_v7.py --verify dist/AI_RESCUE_FACTORY_V7_UNIFIED_CANDIDATE_WINDOWS.zip
      - name: Upload downloadable release ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: AI_RESCUE_FACTORY_V1_V7_AND_ANIME_V19_V48_WINDOWS
          path: |
            dist/*.zip
            dist/RELEASE_INDEX.json
          if-no-files-found: error
          retention-days: 30

  publish-v21-download:
    needs: [tests, visual-smoke, zip-releases]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout latest repository branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build final V21 ZIP with SHA256 manifest
        run: python scripts/build_anime_v21.py --out downloads/AI_ANIME_FACTORY_V21_VISUAL_QUALITY_WINDOWS.zip
      - name: Commit verified ZIP to stable direct downloads folder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V21_VISUAL_QUALITY_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V21 ZIP already current"
          else
            git commit -m "Release verified V21 Visual Quality Windows ZIP"
            git push origin HEAD:main
          fi

