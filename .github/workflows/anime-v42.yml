name: AI Anime Factory V42 Stage Depth and Lighting Production
on:
  pull_request:
    branches: [main]
    paths:
      - "anime-factory/v42/**"
      - "scripts/build_anime_v42.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v42.py"
      - "tests/smoke_browser_v42.py"
      - ".github/workflows/anime-v42.yml"
  push:
    branches: [main]
    paths:
      - "anime-factory/v42/**"
      - "scripts/build_anime_v42.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v42.py"
      - "tests/smoke_browser_v42.py"
      - ".github/workflows/anime-v42.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v42-structural:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile all new V42 scripts and V7
        run: python -m py_compile anime-factory/v41/build_silhouette_v41.py anime-factory/v42/build_stage_v42.py scripts/build_anime_v41.py scripts/build_anime_v42.py scripts/build_v7.py gui_v7.py tests/test_anime_v42.py tests/smoke_browser_v42.py
      - name: Non-destructive project source check
        run: python anime-factory/v42/build_stage_v42.py --selftest
      - name: Real V42 JavaScript Node parsing and Python regressions
        run: python -m unittest discover -s tests -p "test_anime_v42.py" -v
      - name: Deep V19 original, V41 parent, ZIP CRC32/SHA256
        run: python scripts/build_anime_v42.py --selftest

  v42-chromium:
    needs: v42-structural
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install real Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Create real complete V19–V42 HTML
        run: python anime-factory/v42/build_stage_v42.py --output dist/AI_Anime_Factory_V42_STAGE_DEPTH.html
      - name: Chromium real scene illumination, PNG pixel changes, preserved story and real audio WebM
        run: python tests/smoke_browser_v42.py --html dist/AI_Anime_Factory_V42_STAGE_DEPTH.html --out dist/V42_STAGE_SAMPLES
      - name: Build verified standalone Windows ZIP
        run: python scripts/build_anime_v42.py --out dist/AI_ANIME_FACTORY_V42_STAGE_DEPTH_WINDOWS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V42_WINDOWS_VERIFIED
          path: dist/AI_ANIME_FACTORY_V42_STAGE_DEPTH_WINDOWS.zip
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V42_REAL_STAGE_BROWSER_SAMPLES
          path: dist/V42_STAGE_SAMPLES/
          retention-days: 30
          if-no-files-found: error

  publish-v42-download:
    needs: v42-chromium
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build permanent standalone V42 ZIP
        run: python scripts/build_anime_v42.py --out downloads/AI_ANIME_FACTORY_V42_STAGE_DEPTH_WINDOWS.zip
      - name: Publish GitHub raw stable ZIP link like V35 without touching older archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V42_STAGE_DEPTH_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V42 already released"
          else
            git commit -m "Release verified V42 Stage Depth and Lighting Windows ZIP"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "Unable to publish V42 to downloads/" >&2
            exit 1
          fi
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view anime-factory-v42 >/dev/null 2>&1; then
            echo "V42 tag already exists; not overwriting"
          else
            gh release create anime-factory-v42 downloads/AI_ANIME_FACTORY_V42_STAGE_DEPTH_WINDOWS.zip --title "AI Anime Factory V42 Stage Depth and Lighting & Performance" --notes "V42: real 2D deterministic depth layers, keyed lighting, fog, weather, grounded combat contact flash and whole-episode preview; retains V19-V41 artwork, story, audio, subtitles and V35 timeline. Original V19 and full V41 parent ZIP backed up with SHA256/CRC32 checks. Not 3D."
          fi
