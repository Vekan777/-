name: AI Anime Factory V41 Silhouette Studio Production
on:
  pull_request:
    branches: [main]
    paths:
      - "anime-factory/v41/**"
      - "scripts/build_anime_v41.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v41.py"
      - "tests/smoke_browser_v41.py"
      - ".github/workflows/anime-v41.yml"
  push:
    branches: [main]
    paths:
      - "anime-factory/v41/**"
      - "scripts/build_anime_v41.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v41.py"
      - "tests/smoke_browser_v41.py"
      - ".github/workflows/anime-v41.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v41-structural:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile all new V41 scripts and V7
        run: python -m py_compile anime-factory/v40/build_art_v40.py anime-factory/v41/build_silhouette_v41.py scripts/build_anime_v40.py scripts/build_anime_v41.py scripts/build_v7.py gui_v7.py tests/test_anime_v41.py tests/smoke_browser_v41.py
      - name: Non-destructive project source check
        run: python anime-factory/v41/build_silhouette_v41.py --selftest
      - name: Real V41 JavaScript Node parsing and Python regressions
        run: python -m unittest discover -s tests -p "test_anime_v41.py" -v
      - name: Deep V19 original, V38 parent, ZIP CRC32/SHA256
        run: python scripts/build_anime_v41.py --selftest

  v41-chromium:
    needs: v41-structural
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install real Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Create real complete V19–V41 HTML
        run: python anime-factory/v41/build_silhouette_v41.py --output dist/AI_Anime_Factory_V41_SILHOUETTE_STUDIO.html
      - name: Chromium actual character art, screenshots, story and real WebM with sound
        run: python tests/smoke_browser_v41.py --html dist/AI_Anime_Factory_V41_SILHOUETTE_STUDIO.html --out dist/V41_SILHOUETTE_SAMPLES
      - name: Build verified standalone Windows ZIP
        run: python scripts/build_anime_v41.py --out dist/AI_ANIME_FACTORY_V41_SILHOUETTE_STUDIO_WINDOWS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V41_WINDOWS_VERIFIED
          path: dist/AI_ANIME_FACTORY_V41_SILHOUETTE_STUDIO_WINDOWS.zip
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V41_REAL_SILHOUETTE_BROWSER_SAMPLES
          path: dist/V41_SILHOUETTE_SAMPLES/
          retention-days: 30
          if-no-files-found: error

  publish-v41-download:
    needs: v41-chromium
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build permanent standalone V41 ZIP
        run: python scripts/build_anime_v41.py --out downloads/AI_ANIME_FACTORY_V41_SILHOUETTE_STUDIO_WINDOWS.zip
      - name: Publish GitHub raw stable ZIP link like V35 without touching older archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V41_SILHOUETTE_STUDIO_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V41 already released"
          else
            git commit -m "Release verified V41 Silhouette Studio Windows ZIP"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "Unable to publish V41 to downloads/" >&2
            exit 1
          fi
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view anime-factory-v41 >/dev/null 2>&1; then
            echo "V41 tag already exists; not overwriting"
          else
            gh release create anime-factory-v41 downloads/AI_ANIME_FACTORY_V41_SILHOUETTE_STUDIO_WINDOWS.zip --title "AI Anime Factory V41 Silhouette Studio & Performance" --notes "V41: distinct guardian/ranger/arcanist 2D silhouettes and costumes, flowing cape, armor and boots integrated with real V23 rig; proven PNG differences, V40 artwork, V39 movement, V38 color, V37 captions and V36 WebM/audio. Original V19, complete V40 parent ZIP and verified CRC32/SHA256. Not 3D or neural drawing."
          fi
