name: V50.2 Offline 960p-class 12 FPS Russian Pilot Render
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/render_v502_offline.py"
      - "scripts/package_v502_unified_windows.py"
      - "anime-factory/v50_2/OFFLINE_12FPS_README_RU.md"
      - ".github/workflows/anime-v502-offline-12fps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-original-frames-and-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Review V19–V50 source story and Python code
        run: |
          node --check anime-factory/v50_2/motion_rig_v502.js
          node --check anime-factory/v50_2/clean_cuts_v502.js
          python -m py_compile scripts/render_v502_offline.py \
            scripts/package_v502_unified_windows.py \
            anime-factory/v50_2/build_complete_v502.py
          node tests/test_deep_qa_v50.js
          python anime-factory/v50_2/build_complete_v502.py --selftest
      - name: Install FFmpeg, Chromium, Russian speech and portable audio mixer
        run: |
          python -m pip install numpy playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng espeak-ng-data
      - name: Build full source-only bootstrap with 13 original JPG
        run: |
          python anime-factory/v50_2/build_complete_v502.py \
            --out dist/AI_Anime_Factory_V50_2_BOOTSTRAP.html
      - name: Generate original V50 6-episode season and 24 Russian lines
        run: |
          python scripts/produce_2d_pilot_v501.py \
            --html dist/AI_Anime_Factory_V50_2_BOOTSTRAP.html \
            --out dist/V502 --tts
          mv dist/V502/PROJECT_PILOT_V50.json dist/V502/PROJECT_V501.json
          python scripts/postprocess_v502.py \
            --project dist/V502/PROJECT_V501.json \
            --output dist/V502/PROJECT_V502.json
          python anime-factory/v50_2/build_complete_v502.py \
            --project dist/V502/PROJECT_V502.json \
            --out dist/AI_Anime_Factory_V50_2_UNIFIED.html
      - name: Native offline render two FULL 960x540 / 12fps Russian H264/AAC scenes
        run: |
          python scripts/render_v502_offline.py \
            --html dist/AI_Anime_Factory_V50_2_UNIFIED.html \
            --project dist/V502/PROJECT_V502.json \
            --out dist/V502/HD_12FPS --episodes 1,2 --fps 12 --width 960
      - name: Independently inspect real video FPS, all frames, voice and near-black shots
        run: |
          python - <<'PY'
          import json,subprocess,math
          from pathlib import Path
          from PIL import Image,ImageStat
          root=Path('dist/V502/HD_12FPS')
          report=json.loads((root/'V502_OFFLINE_RENDER_QA.json').read_text(encoding='utf-8'))
          assert not report['commercialRightsVerified'] and not report['fullSeasonCompleted']
          assert len(report['episodes'])==2
          for n,e in enumerate(report['episodes'],1):
              video=root/f'episode_{n:02d}.mp4'
              assert video.stat().st_size>200000
              v=json.loads(subprocess.run(['ffprobe','-v','error',
                 '-show_entries','stream=codec_name,codec_type,width,height,avg_frame_rate,nb_frames:format=duration',
                 '-of','json',str(video)],capture_output=True,text=True,check=True).stdout)
              assert {'h264','aac'}.issubset({s.get('codec_name') for s in v['streams']})
              stream=next(s for s in v['streams'] if s.get('codec_type')=='video')
              assert (stream['width'],stream['height'])==(960,540)
              assert stream['avg_frame_rate']=='12/1',stream
              assert int(stream['nb_frames'])==e['frames'] and e['frames']>800
              assert e['distinctFrameDigests']>650
              assert 69<float(v['format']['duration'])<72,v
              assert e['audio']['voiceActiveSamples']>100000
              assert e['audio']['threeIndependentTracks'] and e['audio']['automaticMusicDucking']
              assert (root/f'episode_{n:02d}.srt').is_file()
              shots=list(root.glob(f'ep{n:02d}_frame*.png'))
              assert len(shots)>=9
              means=[sum(ImageStat.Stat(Image.open(p).convert('RGB')).mean)/3 for p in shots]
              assert min(means)>15,(n,means)
              print('V50.2 VERIFIED:',n,e['frames'],'real frames',stream['width'],
                    'x',stream['height'],stream['avg_frame_rate'],'FPS','true AUDIO and subtitles')
          PY
      - name: Bundle new offline renderer into portable Windows 2D studio
        run: |
          python scripts/package_v502_unified_windows.py \
            --html dist/AI_Anime_Factory_V50_2_UNIFIED.html \
            --project dist/V502/PROJECT_V502.json \
            --out dist/AI_ANIME_FACTORY_V502_UNIFIED_12FPS_WINDOWS.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V502_NATIVE_12FPS_TWO_RUSSIAN_EPISODES
          path: |
            dist/V502/HD_12FPS
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: V502_UNIFIED_12FPS_WINDOWS_REPRODUCIBLE_SOURCE
          path: dist/AI_ANIME_FACTORY_V502_UNIFIED_12FPS_WINDOWS.zip
          retention-days: 30
          if-no-files-found: error
