name: AI Anime Factory V48 Episode Production Engine Production
on:
  pull_request:
    branches: [main]
    paths:
      - "anime-factory/v48/**"
      - "anime-factory/v45/art_assets_v45.js"
      - "scripts/build_anime_v48.py"
      - "scripts/render_anime_v48.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v48.py"
      - "tests/smoke_browser_v48.py"
      - ".github/workflows/anime-v48.yml"
  push:
    branches: [main]
    paths:
      - "anime-factory/v48/**"
      - "anime-factory/v45/art_assets_v45.js"
      - "scripts/build_anime_v48.py"
      - "scripts/render_anime_v48.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v48.py"
      - "tests/smoke_browser_v48.py"
      - ".github/workflows/anime-v48.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v48-structural:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile all new V48 scripts and V7
        run: python -m py_compile anime-factory/v47/build_voice_v47.py anime-factory/v48/build_episode_v48.py scripts/build_anime_v47.py scripts/build_anime_v48.py scripts/render_anime_v48.py scripts/build_v7.py gui_v7.py tests/test_anime_v48.py tests/smoke_browser_v48.py
      - name: Retain shared V45 Production Engine Node regression
        run: node tests/test_engine_v45.js
      - name: Non-destructive project source check
        run: python anime-factory/v48/build_episode_v48.py --selftest
      - name: Real V48 JavaScript Node parsing and Python regressions
        run: python -m unittest discover -s tests -p "test_anime_v48.py" -v
      - name: Deep V19 original, V43 source, verified ZIP CRC32/SHA256, ZIP CRC32/SHA256
        run: python scripts/build_anime_v48.py --selftest

  v48-chromium:
    needs: v48-structural
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install real Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Install FFmpeg for actual MP4 H264/AAC verification
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Create real complete V19–V48 HTML
        run: python anime-factory/v48/build_episode_v48.py --output dist/AI_Anime_Factory_V48_EPISODE_ENGINE.html
      - name: Chromium two real H264/AAC MP4 episodes, original WebM audio, SRT/VTT, end credits and SHA-resume
        run: python tests/smoke_browser_v48.py --html dist/AI_Anime_Factory_V48_EPISODE_ENGINE.html --out dist/V48_PRODUCTION_BROWSER
      - name: Build verified standalone Windows ZIP
        run: python scripts/build_anime_v48.py --out dist/AI_ANIME_FACTORY_V48_EPISODE_ENGINE_WINDOWS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V48_WINDOWS_VERIFIED
          path: dist/AI_ANIME_FACTORY_V48_EPISODE_ENGINE_WINDOWS.zip
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V48_REAL_EPISODE_PRODUCTION_SAMPLES
          path: dist/V48_PRODUCTION_BROWSER/
          retention-days: 30
          if-no-files-found: error

  publish-v48-download:
    needs: v48-chromium
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build permanent standalone V48 ZIP
        run: python scripts/build_anime_v48.py --out downloads/AI_ANIME_FACTORY_V48_EPISODE_ENGINE_WINDOWS.zip
      - name: Publish GitHub raw stable ZIP link like V35 without touching older archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V48_EPISODE_ENGINE_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V48 already released"
          else
            git commit -m "Release verified V48 Episode Production Engine Windows ZIP"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "Unable to publish V48 to downloads/" >&2
            exit 1
          fi
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view anime-factory-v48 >/dev/null 2>&1; then
            echo "V48 tag already exists; not overwriting"
          else
            gh release create anime-factory-v48 downloads/AI_ANIME_FACTORY_V48_EPISODE_ENGINE_WINDOWS.zip --title "AI Anime Factory V48 Episode Production Engine & Performance" --notes "V48: episode-production panel with end credits, actual V35 episode timeline, SRT/VTT and season manifest. Separate real Chromium sequential batch renders 2+ WebM with restored V47 audio, H264/AAC MP4 with FFmpeg, FFprobe, and SHA256 resumability at completed-episode boundaries. V19–V47 preserved, full V47 ZIP with SHA256/CRC32. Windows setup+batch BAT and Russian guide included. V49 unified and V50 final remain unfinished."
          fi
