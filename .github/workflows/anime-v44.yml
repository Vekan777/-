name: AI Anime Factory V44 True Actor Keyposes Production
on:
  pull_request:
    branches: [main]
    paths:
      - "anime-factory/v44/**"
      - "scripts/build_anime_v44.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v44.py"
      - "tests/smoke_browser_v44.py"
      - ".github/workflows/anime-v44.yml"
  push:
    branches: [main]
    paths:
      - "anime-factory/v44/**"
      - "scripts/build_anime_v44.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v44.py"
      - "tests/smoke_browser_v44.py"
      - ".github/workflows/anime-v44.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v44-structural:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile all new V44 scripts and V7
        run: python -m py_compile anime-factory/v43/build_director_v43.py anime-factory/v44/build_keyposes_v44.py scripts/build_anime_v43.py scripts/build_anime_v44.py scripts/build_v7.py gui_v7.py tests/test_anime_v44.py tests/smoke_browser_v44.py
      - name: Non-destructive project source check
        run: python anime-factory/v44/build_keyposes_v44.py --selftest
      - name: Real V44 JavaScript Node parsing and Python regressions
        run: python -m unittest discover -s tests -p "test_anime_v44.py" -v
      - name: Deep V19 original, V43 source, verified ZIP CRC32/SHA256, ZIP CRC32/SHA256
        run: python scripts/build_anime_v44.py --selftest

  v44-chromium:
    needs: v44-structural
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install real Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Create real complete V19–V44 HTML
        run: python anime-factory/v44/build_keyposes_v44.py --output dist/AI_Anime_Factory_V44_TRUE_KEYPOSES.html
      - name: Chromium genuine V24 rig pose pixel changes, two timepoints, unchanged canon and audio WebM
        run: python tests/smoke_browser_v44.py --html dist/AI_Anime_Factory_V44_TRUE_KEYPOSES.html --out dist/V44_TRUE_RIG_SAMPLES
      - name: Build verified standalone Windows ZIP
        run: python scripts/build_anime_v44.py --out dist/AI_ANIME_FACTORY_V44_TRUE_KEYPOSES_WINDOWS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V44_WINDOWS_VERIFIED
          path: dist/AI_ANIME_FACTORY_V44_TRUE_KEYPOSES_WINDOWS.zip
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V44_TRUE_RIG_BROWSER_SAMPLES
          path: dist/V44_TRUE_RIG_SAMPLES/
          retention-days: 30
          if-no-files-found: error

  publish-v44-download:
    needs: v44-chromium
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build permanent standalone V44 ZIP
        run: python scripts/build_anime_v44.py --out downloads/AI_ANIME_FACTORY_V44_TRUE_KEYPOSES_WINDOWS.zip
      - name: Publish GitHub raw stable ZIP link like V35 without touching older archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V44_TRUE_KEYPOSES_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V44 already released"
          else
            git commit -m "Release verified V44 True Actor Keyposes Windows ZIP"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "Unable to publish V44 to downloads/" >&2
            exit 1
          fi
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view anime-factory-v44 >/dev/null 2>&1; then
            echo "V44 tag already exists; not overwriting"
          else
            gh release create anime-factory-v44 downloads/AI_ANIME_FACTORY_V44_TRUE_KEYPOSES_WINDOWS.zip --title "AI Anime Factory V44 True Actor Keyposes & Performance" --notes "V44: real draw-time 2D actor keyposes, combat stance/arms/feet and recovery based only on existing V25 combat results; PNG and WebM/audio tests. All V19-V43 sources and original V19 are included. Full V43 ZIP remains available in its immutable GitHub release, linked from inside V44; no recursive ZIP nesting due GitHub 100MiB file limit. ZIP SHA256 and CRC32 verified. Not 3D."
          fi
