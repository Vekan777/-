name: AI Anime Factory V46 Keyframe Animation Engine Production
on:
  pull_request:
    branches: [main]
    paths:
      - "anime-factory/v46/**"
      - "anime-factory/v45/art_assets_v45.js"
      - "scripts/build_anime_v46.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v46.py"
      - "tests/smoke_browser_v46.py"
      - ".github/workflows/anime-v46.yml"
  push:
    branches: [main]
    paths:
      - "anime-factory/v46/**"
      - "anime-factory/v45/art_assets_v45.js"
      - "scripts/build_anime_v46.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v46.py"
      - "tests/smoke_browser_v46.py"
      - ".github/workflows/anime-v46.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v46-structural:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile all new V46 scripts and V7
        run: python -m py_compile anime-factory/v45/build_art_engine_v45.py anime-factory/v46/build_animation_v46.py scripts/build_anime_v45.py scripts/build_anime_v46.py scripts/build_v7.py gui_v7.py tests/test_anime_v46.py tests/smoke_browser_v46.py
      - name: Retain shared V45 Production Engine Node regression
        run: node tests/test_engine_v45.js
      - name: Non-destructive project source check
        run: python anime-factory/v46/build_animation_v46.py --selftest
      - name: Real V46 JavaScript Node parsing and Python regressions
        run: python -m unittest discover -s tests -p "test_anime_v46.py" -v
      - name: Deep V19 original, V43 source, verified ZIP CRC32/SHA256, ZIP CRC32/SHA256
        run: python scripts/build_anime_v46.py --selftest

  v46-chromium:
    needs: v46-structural
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install real Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Create real complete V19–V46 HTML
        run: python anime-factory/v46/build_animation_v46.py --output dist/AI_Anime_Factory_V46_ANIMATION_ENGINE.html
      - name: Chromium genuine multi-layer keyframes, reusable clips, onion skin, JSON and audio WebM
        run: python tests/smoke_browser_v46.py --html dist/AI_Anime_Factory_V46_ANIMATION_ENGINE.html --out dist/V46_ANIMATION_BROWSER
      - name: Build verified standalone Windows ZIP
        run: python scripts/build_anime_v46.py --out dist/AI_ANIME_FACTORY_V46_ANIMATION_ENGINE_WINDOWS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V46_WINDOWS_VERIFIED
          path: dist/AI_ANIME_FACTORY_V46_ANIMATION_ENGINE_WINDOWS.zip
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V46_REAL_ANIMATION_BROWSER_SAMPLES
          path: dist/V46_ANIMATION_BROWSER/
          retention-days: 30
          if-no-files-found: error

  publish-v46-download:
    needs: v46-chromium
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build permanent standalone V46 ZIP
        run: python scripts/build_anime_v46.py --out downloads/AI_ANIME_FACTORY_V46_ANIMATION_ENGINE_WINDOWS.zip
      - name: Publish GitHub raw stable ZIP link like V35 without touching older archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V46_ANIMATION_ENGINE_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V46 already released"
          else
            git commit -m "Release verified V46 Keyframe Animation Engine Windows ZIP"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "Unable to publish V46 to downloads/" >&2
            exit 1
          fi
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view anime-factory-v46 >/dev/null 2>&1; then
            echo "V46 tag already exists; not overwriting"
          else
            gh release create anime-factory-v46 downloads/AI_ANIME_FACTORY_V46_ANIMATION_ENGINE_WINDOWS.zip --title "AI Anime Factory V46 Keyframe Animation Engine & Performance" --notes "V46: true layered actor keyframe animation connected to V16 pose sampling, 7 separately animated parts per actor, five editable 35-key preset actions, reusable cross-scene clips, onion skin and audio WebM. Preserves V19–V45 original code, art and canon; complete V45 ZIP bundled with CRC32/SHA256. V47–V50 remain planned; no 3D."
          fi
