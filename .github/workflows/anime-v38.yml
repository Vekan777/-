name: AI Anime Factory V38 Cinematic Finishing Production
on:
  pull_request:
    branches: [main]
    paths:
      - "anime-factory/v38/**"
      - "scripts/build_anime_v38.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v38.py"
      - "tests/smoke_browser_v38.py"
      - ".github/workflows/anime-v38.yml"
  push:
    branches: [main]
    paths:
      - "anime-factory/v38/**"
      - "scripts/build_anime_v38.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v38.py"
      - "tests/smoke_browser_v38.py"
      - ".github/workflows/anime-v38.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v38-structural:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile V36 to V38 modules and release tools
        run: python -m py_compile anime-factory/v36/build_audio_v36.py anime-factory/v37/build_subtitles_v37.py anime-factory/v38/build_cinematic_v38.py scripts/build_anime_v36.py scripts/build_anime_v37.py scripts/build_anime_v38.py scripts/build_v7.py gui_v7.py tests/test_anime_v38.py tests/smoke_browser_v38.py
      - name: V19-V38 additive selftest
        run: python anime-factory/v38/build_cinematic_v38.py --selftest
      - name: Python and Node regression
        run: python -m unittest discover -s tests -p "test_anime_v38.py" -v
      - name: Release ZIP SHA256 CRC32 and preserved parent V37
        run: python scripts/build_anime_v38.py --selftest

  v38-chromium:
    needs: v38-structural
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install real Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build additive V19-V38 HTML
        run: python anime-factory/v38/build_cinematic_v38.py --output dist/AI_Anime_Factory_V38_CINEMATIC_FINISHING.html
      - name: Real visual differential, PNG frames, V37 subtitle and V36 audio/WebM test
        run: python tests/smoke_browser_v38.py --html dist/AI_Anime_Factory_V38_CINEMATIC_FINISHING.html --out dist/V38_CINEMATIC_SAMPLES
      - name: Verified standalone Windows ZIP
        run: python scripts/build_anime_v38.py --out dist/AI_ANIME_FACTORY_V38_CINEMATIC_FINISHING_WINDOWS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V38_WINDOWS_VERIFIED
          path: dist/AI_ANIME_FACTORY_V38_CINEMATIC_FINISHING_WINDOWS.zip
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V38_REAL_CINEMATIC_BROWSER_SAMPLES
          path: dist/V38_CINEMATIC_SAMPLES/
          retention-days: 30
          if-no-files-found: error

  publish-v38-download:
    needs: v38-chromium
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build tested V38 download ZIP
        run: python scripts/build_anime_v38.py --out downloads/AI_ANIME_FACTORY_V38_CINEMATIC_FINISHING_WINDOWS.zip
      - name: Publish stable raw GitHub download without deleting previous versions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V38_CINEMATIC_FINISHING_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V38 ZIP already published"
          else
            git commit -m "Publish verified V38 Cinematic Finishing Windows ZIP"
            for try in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "V38 raw publication failed after retries" >&2
            exit 1
          fi
      - name: Permanent immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view anime-factory-v38 >/dev/null 2>&1; then
            echo "V38 release exists and will not be overwritten"
          else
            gh release create anime-factory-v38 downloads/AI_ANIME_FACTORY_V38_CINEMATIC_FINISHING_WINDOWS.zip --title "AI Anime Factory V38 Cinematic Finishing" --notes "V38: real 2D Canvas camera motion, color grading, V37 subtitles and V36 WebM/audio maintained; original V19, all V20–V38 source, V37 parent archive and integrity checks. MP4 via FFmpeg. Not 3D."
          fi
