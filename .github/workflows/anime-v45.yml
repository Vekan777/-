name: AI Anime Factory V45 Art Assets and Production Engine Production
on:
  pull_request:
    branches: [main]
    paths:
      - "anime-factory/v45/**"
      - "anime-factory/engine/anime_production_engine_v45.js"
      - "scripts/build_anime_v45.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v45.py"
      - "tests/smoke_browser_v45.py"
      - ".github/workflows/anime-v45.yml"
  push:
    branches: [main]
    paths:
      - "anime-factory/v45/**"
      - "anime-factory/engine/anime_production_engine_v45.js"
      - "scripts/build_anime_v45.py"
      - "scripts/build_v7.py"
      - "gui_v7.py"
      - "tests/test_anime_v45.py"
      - "tests/smoke_browser_v45.py"
      - ".github/workflows/anime-v45.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v45-structural:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile all new V45 scripts and V7
        run: python -m py_compile anime-factory/v44/build_keyposes_v44.py anime-factory/v45/build_art_engine_v45.py scripts/build_anime_v44.py scripts/build_anime_v45.py scripts/build_v7.py gui_v7.py tests/test_anime_v45.py tests/smoke_browser_v45.py
      - name: Shared Anime Production Engine Node regression
        run: node tests/test_engine_v45.js
      - name: Non-destructive project source check
        run: python anime-factory/v45/build_art_engine_v45.py --selftest
      - name: Real V45 JavaScript Node parsing and Python regressions
        run: python -m unittest discover -s tests -p "test_anime_v45.py" -v
      - name: Deep V19 original, V43 source, verified ZIP CRC32/SHA256, ZIP CRC32/SHA256
        run: python scripts/build_anime_v45.py --selftest

  v45-chromium:
    needs: v45-structural
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install real Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Create real complete V19–V45 HTML
        run: python anime-factory/v45/build_art_engine_v45.py --output dist/AI_Anime_Factory_V45_ART_ENGINE.html
      - name: Chromium actual cutout PNGs, two characters/worlds, portable JSON and audio WebM
        run: python tests/smoke_browser_v45.py --html dist/AI_Anime_Factory_V45_ART_ENGINE.html --out dist/V45_ART_BROWSER
      - name: Build verified standalone Windows ZIP
        run: python scripts/build_anime_v45.py --out dist/AI_ANIME_FACTORY_V45_ART_ENGINE_WINDOWS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V45_WINDOWS_VERIFIED
          path: dist/AI_ANIME_FACTORY_V45_ART_ENGINE_WINDOWS.zip
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AI_ANIME_FACTORY_V45_REAL_ART_BROWSER_SAMPLES
          path: dist/V45_ART_BROWSER/
          retention-days: 30
          if-no-files-found: error

  publish-v45-download:
    needs: v45-chromium
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build permanent standalone V45 ZIP
        run: python scripts/build_anime_v45.py --out downloads/AI_ANIME_FACTORY_V45_ART_ENGINE_WINDOWS.zip
      - name: Publish GitHub raw stable ZIP link like V35 without touching older archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI_ANIME_FACTORY_V45_ART_ENGINE_WINDOWS.zip
          if git diff --cached --quiet; then
            echo "V45 already released"
          else
            git commit -m "Release verified V45 Art Assets and Production Engine Windows ZIP"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "Unable to publish V45 to downloads/" >&2
            exit 1
          fi
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view anime-factory-v45 >/dev/null 2>&1; then
            echo "V45 tag already exists; not overwriting"
          else
            gh release create anime-factory-v45 downloads/AI_ANIME_FACTORY_V45_ART_ENGINE_WINDOWS.zip --title "AI Anime Factory V45 Art Assets and Production Engine & Performance" --notes "V45: generated seven-piece character PNG cutouts, editable pivots, image imports, genuine scene backgrounds, portable art JSON and modular production engine for worlds/stories/relationships/camera. All V19-V44 source preserved and complete V44 ZIP backed up; CRC32/SHA256 and real Chromium WebM QA. V46-V50 still planned, not claimed finished. Not 3D."
          fi
